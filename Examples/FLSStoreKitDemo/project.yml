name: FLSStoreKitDemo
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  FLSStoreKit:
    path: ../..
targets:
  FLSStoreKitDemo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fls.storekit.demo
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: FLSStoreKit
    scheme:
      storeKitConfiguration: Demo.storekit
